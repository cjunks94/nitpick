version: 2
updates:
  # Go module dependencies (anthropic SDK + transitive, yaml.v3)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # Base images in the Dockerfile are pinned by digest; this keeps the
  # digests moving with each tag's rebuilds.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - infra
    commit-message:
      prefix: chore
      include: scope
